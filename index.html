<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Paper airplane wind tunnel</p>
      <h1>Glide</h1>
    </div>
  </header>

  <main class="layout">
    <section class="studio-panel" aria-labelledby="studioTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Fold studio</p>
          <h2 id="studioTitle">Shape the paper</h2>
        </div>
        <div class="button-row">
          <button id="undoFold" type="button">Undo</button>
          <button id="resetDesign" type="button">Reset</button>
        </div>
      </div>

      <div class="preview-shell">
        <canvas id="previewCanvas" width="720" height="420" aria-label="Paper airplane preview"></canvas>
      </div>

      <div class="fold-grid" id="foldControls"></div>

      <div class="sequence-block">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">Build order</p>
            <h3>Fold sequence</h3>
          </div>
        </div>
        <ol class="sequence-list" id="sequenceList" aria-label="Reorder fold sequence"></ol>
      </div>

      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <section class="tunnel-panel" aria-labelledby="tunnelTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Wind tunnel</p>
          <h2 id="tunnelTitle">Launch and compare</h2>
        </div>
        <div class="button-row">
          <button id="launchButton" type="button">Launch</button>
          <button id="resetFlight" type="button">Reset flight</button>
        </div>
      </div>

      <div class="flight-shell">
        <canvas id="flightCanvas" width="980" height="520" aria-label="Flight simulation"></canvas>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
